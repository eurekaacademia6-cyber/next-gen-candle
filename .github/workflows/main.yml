name: Build Quotex Vision AI 4.0.4

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify project structure
        shell: pwsh
        run: |
          $files = @(
            "main.py",
            "requirements.txt",
            "capture.py",
            "timing.py",
            "vision\models.py",
            "vision\detector.py",
            "analysis\engine.py",
            "analysis\indicators.py",
            "ui\main_window.py",
            "ui\overlay.py",
            "installer\QuotexVisionAI.iss"
          )

          foreach ($file in $files) {
            if (!(Test-Path $file)) {
              Write-Error "Missing: $file"
            }
            Write-Host "OK: $file"
          }

      - name: Validate Python source
        shell: pwsh
        run: |
          python -m compileall .

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Python syntax validation failed."
          }

      - name: Validate imports
        shell: pwsh
        run: |
          python -c "from vision.detector import CandleDetector, DetectorConfig; from vision.models import Candle, Detection, Signal; from analysis.engine import AnalysisEngine; from analysis.indicators import build_snapshot; from timing import CandleClock; from ui.overlay import Overlay; from ui.main_window import MainWindow; print('IMPORTS OK')"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Import validation failed."
          }

      - name: Test MainWindow startup
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from ui.main_window import MainWindow; app=QApplication([]); window=MainWindow(); print('MAINWINDOW STARTUP OK'); window.close(); app.quit()"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MainWindow startup failed."
          }

      - name: Test analysis engine
        shell: pwsh
        run: |
          python -c "from analysis.engine import AnalysisEngine; print('ANALYSIS ENGINE IMPORT OK')"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Analysis engine test failed."
          }

      - name: Clean build directories
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force installer\dist -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path installer\dist | Out-Null

      - name: Build application EXE
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $main = Join-Path $root "main.py"

          if (!(Test-Path $main)) {
            Write-Error "main.py not found."
          }

          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onedir `
            --windowed `
            --name "QuotexVisionAI" `
            --paths "$root" `
            --collect-all PySide6 `
            --collect-all cv2 `
            --collect-all mss `
            "$main"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "PyInstaller build failed."
          }

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "dist\QuotexVisionAI\QuotexVisionAI.exe"

          if (!(Test-Path $exe)) {
            Write-Error "EXE was not created."
          }

          Write-Host "EXE successfully created:"
          Get-Item $exe

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup installation failed."
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            Write-Error "Inno Setup compiler not found."
          }

          & $iscc "installer\QuotexVisionAI.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Installer build failed."
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = "installer\dist\QuotexVisionAI-Setup.exe"

          if (!(Test-Path $setup)) {
            Write-Error "Installer was not created."
          }

          Write-Host "INSTALLER CREATED:"
          Get-Item $setup

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: QuotexVisionAI-NextGen-4.0.4-Installer
          path: installer/dist/QuotexVisionAI-Setup.exe
          if-no-files-found: error
